<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Installable web app. iOS only delivers web push to a site added to the
         Home Screen as a standalone app, which needs this manifest. The agent
         app swaps in agent.webmanifest so cleaners' icon opens /agent. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NexClean" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4F7CFF" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://nexclean.in/" />

    <title>NexClean — Premium Car Care, Delivered To Your Doorstep</title>
    <meta
      name="description"
      content="NexClean is premium on-demand vehicle care. Certified specialists arrive at your home, office, or society and transform your vehicle while you relax." />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="NexClean — Premium Car Care, Delivered" />
    <meta
      property="og:description"
      content="Your Car. Our Care. Book professional doorstep vehicle care in seconds." />
    <meta property="og:site_name" content="NexClean" />
    <meta property="og:url" content="https://nexclean.in/" />
    <meta property="og:image" content="https://nexclean.in/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:title" content="NexClean — Premium Car Care, Delivered" />
    <meta name="twitter:description" content="Your Car. Our Care. Book professional doorstep vehicle care in seconds." />
    <meta name="twitter:image" content="https://nexclean.in/og-image.png" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
